<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reader 双模式导航</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#26352f;font:15px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px 20px}h1{font-size:26px;margin:0}p{margin:8px 0 20px;color:#55635b}.controls{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:20px 0}label{display:flex;gap:8px;align-items:center}select,input,button{font:inherit}select{padding:6px;max-width:150px}button{cursor:pointer}input[type=checkbox]{width:20px;height:20px;accent-color:#294b39}output{display:block;margin:16px 0;font-variant-numeric:tabular-nums}.stage{width:100%;max-width:100%;margin:auto;overflow:hidden;border:1px solid #d4d8d2;border-radius:20px;background:#e6e9e3}.viewport{position:relative;transform-origin:top left;overflow:hidden;background:var(--paper);color:var(--ink)}.header{position:absolute;top:0;left:0;right:0;height:68px;display:flex;align-items:center;justify-content:center;background:var(--paper);font-size:22px;font-weight:700;z-index:1}.scroll{position:absolute;inset:0;overflow:auto;scrollbar-width:thin}.content{padding-top:80px}.books{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.book{min-width:0}.cover{aspect-ratio:2/3;background:linear-gradient(150deg,#294b39,#758271);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;letter-spacing:3px;font-size:22px}.book p{margin:6px 0 14px;font-size:calc(14px * var(--font-scale));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.section{font-size:calc(18px * var(--font-scale));margin:0 0 18px}.setting{padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;font-size:calc(15px * var(--font-scale))}.setting-row{padding:12px 0;border-bottom:1px solid var(--border)}.setting-row:last-child{border:0}.tail{height:40px;display:flex;align-items:center;justify-content:center;background:var(--surface);font-size:14px}.nav{position:absolute;display:flex;background:var(--surface);border:1px solid var(--border);box-shadow:0 5px 18px #26352f1f;align-items:center;justify-content:center;overflow:hidden;z-index:2}.nav.bottom{flex-direction:row;padding:4px;gap:4px}.nav.rail{flex-direction:column;padding:8px;gap:6px}.tab{border:0;min-width:0;padding:0;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;background:transparent;color:var(--muted);border-radius:999px;flex:1}.tab[aria-pressed=true]{background:var(--active);color:var(--on-active)}.tab img{height:30px;width:30px;padding:3px}.tab span{display:block;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:calc(var(--label-size) * var(--font-scale));line-height:calc(var(--label-line) * var(--font-scale));font-weight:700}.tab:focus-visible{outline:3px solid #ea9d38;outline-offset:-3px}.foot{font-size:13px;overflow-wrap:anywhere;margin-top:18px}#mode{font-weight:700}.badge{display:inline-block;background:#e2eadf;border-radius:8px;padding:3px 9px}button.reset{border:1px solid #a7b4a8;background:transparent;border-radius:8px;padding:6px 10px}
</style></head><body><main>
<h1>Reader 双模式导航</h1><p>首次启动使用底栏。开启“宽屏使用侧边导航”后，宽度与可用高度同时满足条件才显示侧栏。</p>
<div class="controls">
<label><input id="rail" type="checkbox">宽屏使用侧边导航</label>
<label>宿主宽度 <select id="width"><option>320</option><option>599</option><option>600</option><option selected>760</option><option>960</option></select></label>
<label>宿主高度 <select id="height"><option>180</option><option>240</option><option selected>700</option><option>900</option></select></label>
<label>系统字号 <select id="font"><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select></label>
<button class="reset" id="reset">恢复默认</button>
</div>
<output id="status" aria-live="polite"></output>
<div class="stage" id="stage"><div class="viewport" id="viewport"><div class="header" id="header">书架</div><div class="scroll" id="scroll"><div class="content" id="content"></div></div><nav class="nav" id="nav" aria-label="主导航"></nav></div></div>
<p class="foot">结构与交互演示，书籍为示意内容；不是 VM / 真机截图或原生验收。导航决策、字号尺寸和 viewport 读取直接来自本次生产源码快照。模拟安全底边为 24 vp，宿主尺寸已扣除顶部安全区。浏览器内的开关仅影响本演示。</p>
<p class="foot" id="provenance"></p>
</main><script>
/* SNAPSHOT */
/* PRODUCTION_MODULES */
const cache={};let metrics;
const storage=new Map();const AppStorage={get:k=>storage.get(k),setOrCreate:(k,v)=>storage.set(k,v)};
function require(id){if(cache[id])return cache[id].exports;const module={exports:{}};cache[id]=module;moduleFactories[id](require,module,module.exports);return module.exports;}
const navSpec=require('features/shell/MainNavigationSpec.ts');
const floating=require('features/common/ReaderFloatingBarMetrics.ts');
const windows=require('features/common/ReaderWindowMetrics.ts');
const geo=require('features/common/ReaderPageGeometry.ts');
const horizontal=require('features/common/SurfaceHorizontalGeometry.ts');
const type=require('features/common/ReaderTypography.ets');
const tokens=require('features/common/ReaderTokens.ets');
const theme=require('features/common/ReaderThemeRegistry.ts');
metrics=windows.createDefaultReaderWindowMetrics();metrics.ready=true;metrics.windowRect.width=1200;metrics.windowRect.height=1000;metrics.navigationInsets.bottom=24;
const $=id=>document.getElementById(id);let active='bookshelf';
$('rail').checked=snapshot.defaultRail;
function cssColor(v){return v.length===9?'#'+v.slice(3)+v.slice(1,3):v;}
for(const [name,role] of Object.entries({paper:'TOK_PAPER',ink:'TOK_INK',surface:'app.navigation.floatingSurface',border:'app.navigation.floatingBorder',active:'TOK_PRIMARY_DARK','on-active':'TOK_ON_PRIMARY',muted:'TOK_MUTED'}))$('viewport').style.setProperty('--'+name,cssColor(theme.readerAppColor(role,'day')));
$('provenance').textContent='导航计算源码快照 SHA-256：'+snapshot.hash;
function render(){
 const width=Number($('width').value),height=Number($('height').value),font=Number($('font').value);
 metrics.systemFontScale=font;navSpec.publishReaderMainViewport(width,height);
 const mode=navSpec.readerMainNavigationMode($('rail').checked),vertical=mode==='rail';
 const frame=new geo.ReaderPageGeometryInput(metrics);frame.viewportWidth=navSpec.readerMainViewport().width;
 frame.contentMaxWidth=active==='bookshelf'?620:tokens.TOK_CONTENT_MAX_W_TABLET;
 if(vertical && active==='bookshelf'){frame.contentLeftGap=navSpec.readerMainRailContentLeft();frame.contentRightGap=navSpec.readerMainRailContentRight();}
 else {frame.contentLeadingRail=vertical?navSpec.readerMainRailLeading():0;frame.contentHorizontalPadding=tokens.TOK_SCREEN_INSET;}
 const content=geo.resolveReaderPageGeometry(frame).content.frame;
 const inset=vertical?navSpec.readerMainRailBottomInset():floating.readerFloatingTabContentInset(metrics);
 const navHeight=vertical?navSpec.mainTabRailHeight(navSpec.MAIN_TABS.length,font):floating.readerFloatingTabBarHeight(font);
 const navWidth=vertical?navSpec.MAIN_TAB_RAIL_WIDTH:horizontal.resolveHorizontalFrame(width,0,0,new horizontal.SurfaceWidthSpec(navSpec.mainTabBottomWidth(navSpec.MAIN_TABS.length),32,32)).width;
 const view=$('viewport');Object.assign(view.style,{width:width+'px',height:height+'px'});view.style.setProperty('--font-scale',font);
 view.style.setProperty('--label-size',type.TYPE_MAIN_TAB_LABEL.fontSizeFp+'px');view.style.setProperty('--label-line',type.TYPE_MAIN_TAB_LABEL.lineHeightFp+'px');
 $('content').style.paddingLeft=content.left+'px';$('content').style.paddingRight=content.right+'px';$('content').style.paddingBottom=inset+'px';
 $('header').textContent=active==='bookshelf'?'书架':'设置';
 $('content').innerHTML=active==='bookshelf'?'<h2 class="section">我的书架</h2><div class="books">'+Array.from({length:9},(_,i)=>'<div class="book"><div class="cover">示意 '+(i+1)+'</div><p>演示书籍 '+(i+1)+'</p></div>').join('')+'</div><div class="tail">内容末尾</div>':'<div class="setting">'+['通用设置','书源管理','书架设置','下载管理'].map(s=>'<div class="setting-row">'+s+'</div>').join('')+'</div><div class="setting">宽屏使用侧边导航：'+($('rail').checked?'开启':'关闭')+'</div><div class="tail">内容末尾</div>';
 const nav=$('nav');nav.className='nav '+mode;nav.dataset.mode=mode;
 Object.assign(nav.style,{width:navWidth+'px',height:navHeight+'px',left:(vertical?navSpec.readerMainRailLeft():(width-navWidth)/2)+'px',top:vertical?navSpec.readerMainRailTop()+'px':'auto',bottom:vertical?'auto':floating.readerFloatingTabBottomInset(metrics)+'px',borderRadius:tokens.TOK_RADIUS_PILL+'px'});
 nav.innerHTML=navSpec.MAIN_TABS.map(t=>{const key=t.key==='bookshelf'?'library':'settings';return '<button class="tab" data-key="'+t.key+'" aria-pressed="'+(t.key===active)+'" style="'+(vertical?'width:66px;flex:none;':'')+'height:'+floating.readerMainTabItemHeight(font,vertical)+'px"><img alt="" src="'+snapshot.icons[key+'_'+(t.key===active?'active':'outline')]+'"><span>'+t.label+'</span></button>';}).join('');
 nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.key;$('scroll').scrollTop=0;render();});
 $('status').textContent=(vertical?'侧栏':'底栏')+' · 宿主 '+width+' × '+height+' vp · 导航高度 '+navHeight+' vp · 内容底部留白 '+inset+' vp'+($('rail').checked&&!vertical?' · 窄屏或高度不足，自动回退':'');
 fit();
}
function fit(){const width=Number($('width').value),height=Number($('height').value);$('stage').style.width=width+'px';const scale=Math.min(1,$('stage').clientWidth/width);$('viewport').style.transform='scale('+scale+')';$('stage').style.height=height*scale+'px';}
for(const id of ['rail','width','height','font'])$(id).addEventListener('change',render);
$('reset').onclick=()=>{$('rail').checked=snapshot.defaultRail;$('width').value='760';$('height').value='700';$('font').value='1';active='bookshelf';render();};
window.addEventListener('resize',fit);render();
</script></body></html>
