<h1>Reader 双模式导航</h1><p>首次启动使用底栏。开启“宽屏使用侧边导航”后，宽度与可用高度同时满足条件才显示侧栏。</p>
<div class="controls">
<label><input id="rail" type="checkbox">宽屏使用侧边导航</label>
<label>宿主宽度 <select id="width"><option>320</option><option>599</option><option>600</option><option selected>760</option><option>960</option></select></label>
<label>宿主高度 <select id="height"><option>180</option><option>240</option><option selected>700</option><option>900</option></select></label>
<label>系统字号 <select id="font"><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select></label>
<button class="reset" id="reset">恢复默认</button>
</div>
<output id="status" aria-live="polite"></output>
<div class="stage" id="stage"><div class="viewport" id="viewport"><div class="header" id="header">书架</div><div class="scroll" id="scroll"><div class="content" id="content"></div></div><nav class="nav" id="nav" aria-label="主导航"></nav></div></div>
<p class="foot">结构与交互演示，书籍为示意内容；不是 VM / 真机截图或原生验收。导航决策、字号尺寸和 viewport 读取直接来自本次生产源码快照。模拟安全底边为 24 vp，宿主尺寸已扣除顶部安全区。浏览器内的开关仅影响本演示。</p>
<p class="foot" id="provenance"></p>
