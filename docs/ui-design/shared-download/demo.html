    const visible=visibleBooks();
    ui.tabs.hidden=!!detail();ui['list-controls'].hidden=!!detail();
    root.querySelectorAll('[data-tab]').forEach(el=>el.setAttribute('aria-selected',String(el.dataset.tab===state.tab)));
    ui.list.setAttribute('role',detail()?'region':'tabpanel');
    ui.list.setAttribute('aria-labelledby',detail()?'shared-download-page-heading':`shared-download-${state.tab}-tab`);
    ui['list-count'].textContent=`${visible.length} / ${books.length} 本书`;
    ui.list.innerHTML=detail()?renderDetail(detail()):visible.length?visible.map(b=>renderBook(b)).join(''):`<div class="empty">${icon(books.length?'search':'book-open')}<strong>${books.length?'没有匹配的书籍':'书架为空'}</strong><span>${books.length?'调整搜索关键词或筛选条件':'加入书架后，可在这里管理下载'}</span></div>`;
  };
  const render=()=>{renderList();renderSheet();renderChrome();if(window.lucide)window.lucide.createIcons({attrs:{width:18,height:18}});};
  const closeSheet=()=>{state.sheet=null;renderChrome();ui['sheet-layer'].hidden=true;};
  const dialog=(type,bookIds,chapterSelection=null)=>{
    const targets=bookIds.filter(id=>!!book(id));if(!targets.length)return;
    const labels={cancel:['取消下载任务？','已下载的内容会保留，可以继续阅读。','取消任务'],release:['取消离线保留？','允许自动清理所选书籍的内容。书架与阅读记录保留。','取消保留'],delete:['删除本地内容？','删除所选书籍的本地内容，之后阅读需要重新获取。书架与阅读记录保留。','删除内容']};
    const [title,copy,label]=labels[type];
    const scope=chapterSelection?`${chapterSelection.length}${unit(book(targets[0]))}`:`${targets.length}本书`;
    const chapterCopy={cancel:'仅取消所选章节的剩余下载，已下载内容保留。',release:'允许自动清理所选章节的内容，其他章节不受影响。',delete:'仅删除所选章节的本地内容，并取消这些章节的剩余下载。书架和阅读记录保留。'};
    state.dialog={type,bookIds:targets,chapters:chapterSelection?[...chapterSelection]:null,title:chapterSelection?`确认${label} · ${scope}？`:`${title}（${scope}）`,copy:chapterSelection?chapterCopy[type]:copy,label};renderChrome();
  };
  const start=(b,targets,wholeBook=false)=>{
    if(!targets.length)return;
    if(state.scenario==='empty')state.scenario='normal';
    const combined=[...new Set([...(b.job?.targets||[]),...targets])].sort((a,c)=>a-c);
    const cached=targets.filter(n=>b.cached.includes(n)||b.saved.includes(n));b.saved=[...new Set([...b.saved,...cached])].sort((a,c)=>a-c);
    const completed=[...new Set([...(b.job?.completed||[]),...cached])];
    const missing=combined.filter(n=>!completed.includes(n));
    const priorRunning=b.job?.running||[];
    const running=wholeBook?missing:[...new Set([...priorRunning,...targets.filter(n=>!completed.includes(n))])];
    if(missing.length)b.job={status:running.length?'downloading':'paused',error:null,targets:combined,completed,running,current:running[0]||missing[0]};else b.job=null;
    syncJob(b);
    state.sheet=null;state.manage=false;state.selected=[];state.chapterSelected=[];
    if(wholeBook)state.detailBook=null;
    render();persist();notify(missing.length?'下载已加入任务':'下载完成');
  };
  const chapterAction=(action,numbers)=>{
    const b=detail();if(!b)return;const selected=[...new Set(numbers)].filter(n=>Number.isInteger(n)&&n>=1&&n<=b.total);if(!selected.length)return;
    if(action==='read'){const n=selected[0];state.readerPreview={bookTitle:b.title,chapterTitle:chapter(b,n).title,kind:b.kind,bookId:b.id,chapterIndex:n};state.sheet='read';render();return;}
    if(['cancel','release','delete'].includes(action)){state.sheet=null;renderSheet();dialog(action,[b.id],selected);return;}
    if(action==='download'||action==='resume'){start(b,selected);return;}
    if(action==='pause'&&b.job){b.job.running=b.job.running.filter(n=>!selected.includes(n));syncJob(b);}
    state.sheet=null;render();persist();notify('所选章节已暂停');
  };
  const bookAction=(action,bookIds)=>{
    if(detail())return;const selected=[...new Set(bookIds)].map(book).filter(Boolean);if(!selected.length)return;
    if(['cancel','release','delete'].includes(action)){state.sheet=null;renderSheet();dialog(action,selected.map(b=>b.id));return;}
    if(action==='download'){for(const b of selected)start(b,b.job?.targets||chapterIds(b),true);return;}
    for(const b of selected){if(!b.job||action==='pause'&&!['downloading','queued'].includes(b.job.status))continue;b.job.running=action==='pause'?[]:b.job.targets.filter(n=>!b.job.completed.includes(n));b.job.status=b.job.running.length?'downloading':'paused';if(action!=='pause')b.job.error=null;syncJob(b);}
    state.sheet=null;render();persist();notify(action==='pause'?'所选书籍下载已暂停':'所选书籍下载已继续');
  };
  const locateCurrent=()=>{const b=detail();if(!b)return;const row=ui.list.querySelector(`[data-chapter-row="${b.job?.current||b.current}"]`);if(row)ui.scroll.scrollTop=Math.max(0,row.offsetTop-ui.scroll.offsetTop-12);};
  const tick=()=>{
    if(!root.isConnected){clearInterval(timer);timer=null;return;}
    if(!state.animate)return;
    let changed=false;
    if(!books.some(b=>b.job?.status==='downloading')){const next=books.find(b=>b.job?.status==='queued');if(next){next.job.status='downloading';next.job.running=next.job.targets.filter(n=>!next.job.completed.includes(n));changed=true;}}
    for(const b of books){
      if(b.job?.status!=='downloading')continue;
      const pending=b.job.running.find(n=>!b.job.completed.includes(n));
      if(pending===undefined){syncJob(b);changed=true;continue;}
      const ch=chapter(b,pending);b.job.current=pending;
      if(b.kind==='manga')b.partial[pending]=b.cached.includes(pending)?ch.pages:Math.min(ch.pages,(b.partial[pending]||0)+6);
      if(b.kind==='novel'||b.partial[pending]===ch.pages){b.saved=[...new Set([...b.saved,pending])].sort((a,c)=>a-c);b.cached=[...new Set([...b.cached,pending])];b.job.completed=[...new Set([...b.job.completed,pending])];delete b.partial[pending];}
      syncJob(b);
      changed=true;
    }
    if(changed){renderList();renderChrome();if(window.lucide)window.lucide.createIcons({attrs:{width:18,height:18}});persist();}
  };
  root.addEventListener('click',event=>{
    const button=event.target.closest('button');
    const bookActionButton=button&&(button.dataset.job||button.dataset.bookDownload||button.dataset.bookMore);
    const opening=event.target.closest('[data-open-book]');
    if(opening?.dataset.openBook&&!bookActionButton&&!event.target.closest('input')&&!detail()){
      if(state.manage){const id=opening.dataset.openBook;state.selected=state.selected.includes(id)?state.selected.filter(n=>n!==id):[...state.selected,id];render();persist();}else openBook(opening.dataset.openBook);return;
    }
    if(!button||!root.contains(button)||button.disabled)return;
    if(button.dataset.tab){if(detail())return;state.tab=button.dataset.tab;state.manage=false;state.selected=[];ui.scroll.scrollTop=0;render();persist();return;}
    if(button.dataset.openBook){if(!detail())openBook(button.dataset.openBook);return;}
    if(button.dataset.bookDownload){if(!detail())start(book(button.dataset.bookDownload),chapterIds(book(button.dataset.bookDownload)),true);return;}
    if(button.dataset.bookMore){if(detail())return;state.bookActionIds=[button.dataset.bookMore];state.sheet='book-actions';render();return;}
    if(button.dataset.selectedBookAction){bookAction(button.dataset.selectedBookAction,state.bookActionIds);return;}
    if(button.dataset.selectGroup){const b=detail();if(!b||!state.manage)return;const startAt=Number(button.dataset.selectGroup)===1?1:11;state.chapterSelected=[...new Set([...state.chapterSelected,...ids(10,startAt)])];render();persist();return;}
    if(button.dataset.chapterAction){chapterAction(button.dataset.chapterAction,[Number(button.dataset.chapter)]);return;}
    if(button.dataset.chapterMore){if(!detail())return;state.actionChapters=[Number(button.dataset.chapterMore)];state.sheet='chapter-actions';render();return;}
    if(button.dataset.selectedChapterAction){chapterAction(button.dataset.selectedChapterAction,state.actionChapters);return;}
    if(button.dataset.job){if(detail())return;const b=book(button.dataset.book);if(!b?.job)return;const action=button.dataset.job;if(action==='cancel'){dialog('cancel',[b.id]);return;}b.job.running=action==='pause'?[]:b.job.targets.filter(n=>!b.job.completed.includes(n));b.job.status=action==='pause'||!b.job.running.length?'paused':'downloading';if(action!=='pause')b.job.error=null;syncJob(b);render();persist();return;}
    switch(button.dataset.action){
      case 'back':if(detail()){returnToList();return;}state.manage=false;state.selected=[];ui.scroll.scrollTop=0;break;
      case 'manage':state.manage=!state.manage;state.selected=[];state.chapterSelected=[];break;
      case 'clear-search':state.query='';state.selected=[];ui.scroll.scrollTop=0;break;
      case 'filter':if(detail())return;state.sheet='filter';break;
      case 'sort':if(detail())return;state.sheet='sort';break;
      case 'toggle-sort-direction':if(detail())return;state.sortDirection=state.sortDirection==='asc'?'desc':'asc';ui.scroll.scrollTop=0;break;
      case 'books-download':bookAction('download',state.selected);return;
      case 'books-more':if(detail()||!state.selected.length)return;state.bookActionIds=[...state.selected];state.sheet='book-actions';break;
      case 'settings':if(detail())return;state.sheet='settings';break;
      case 'close-sheet':closeSheet();return;
      case 'select-all':if(detail())state.chapterSelected=state.chapterSelected.length===detail().total?[]:chapterIds(detail());else state.selected=state.selected.length===eligibleIds().length?[]:eligibleIds();break;
      case 'bulk-pause':if(detail())return;state.selected.forEach(id=>{const b=book(id);if(b.job){b.job.status='paused';b.job.running=[];}});break;
      case 'bulk-cancel':if(!detail())dialog('cancel',state.selected);return;
      case 'release':if(!detail())dialog('release',state.selected);return;
      case 'delete':if(!detail())dialog('delete',state.selected);return;
      case 'chapters-download':chapterAction('download',state.chapterSelected);return;
      case 'chapters-pause':chapterAction('pause',state.chapterSelected);return;
      case 'chapters-more':if(!detail()||!state.chapterSelected.length)return;state.actionChapters=[...state.chapterSelected];state.sheet='chapter-actions';break;
      case 'locate-current':locateCurrent();return;
      case 'cancel-dialog':state.dialog=null;break;
      case 'confirm-dialog':{
        const d=state.dialog;if(!d)return;
        for(const id of d.bookIds){const b=book(id);if(d.chapters){const chosen=d.chapters;if(d.type==='release'){b.cached=[...new Set([...b.cached,...b.saved.filter(n=>chosen.includes(n))])];b.saved=b.saved.filter(n=>!chosen.includes(n));}else if(d.type==='delete'){b.saved=b.saved.filter(n=>!chosen.includes(n));b.cached=b.cached.filter(n=>!chosen.includes(n));chosen.forEach(n=>delete b.partial[n]);}if(d.type!=='release'&&b.job){b.job.targets=b.job.targets.filter(n=>!chosen.includes(n));syncJob(b);}}else if(d.type==='cancel')b.job=null;else if(d.type==='release'){b.cached=[...new Set([...b.cached,...b.saved])];b.saved=[];}else{b.saved=[];b.cached=[];b.partial={};b.job=null;}}
        state.dialog=null;state.sheet=null;state.manage=false;state.selected=[];state.chapterSelected=[];render();persist();notify(d.type==='cancel'?'任务已取消，已下载内容保留':d.type==='release'?'已取消离线保留':'所选本地内容已删除');return;
      }
      case 'clear-cache':books.forEach(b=>{b.cached=b.cached.filter(n=>b.saved.includes(n)||(b.job?.status==='downloading'&&b.job.targets.includes(n)));if(!b.job)b.partial={};});render();persist();notify('已完成清理');return;
    }
    render();persist();
  });
  root.addEventListener('change',event=>{
    const el=event.target;
    if(el===ui.scenario){
      state.scenario=el.value;state.tab='all';state.query='';state.filterState='all';state.filterSource='all';state.sort='recent';state.sortDirection='desc';state.detailBook=null;state.listScroll=0;state.manage=false;state.selected=[];state.chapterSelected=[];state.sheet=null;state.dialog=null;books=el.value==='empty'?[]:sourceBooks.map(initialBook);ui.scroll.scrollTop=0;
      if(el.value==='uncached')books.forEach(b=>{b.saved=[];b.cached=[];b.partial={};b.job=null;});
      render();persist();return;
    }
    if(el===ui.animate){state.animate=el.checked;if(timer)clearInterval(timer);timer=state.animate?setInterval(tick,1500):null;persist();return;}
    if(el.dataset.listSetting){if(detail())return;state[el.dataset.listSetting]=el.value;if(!['sort','sortDirection'].includes(el.dataset.listSetting))state.selected=[];ui.scroll.scrollTop=0;renderList();renderChrome();if(window.lucide)window.lucide.createIcons({attrs:{width:18,height:18}});persist();return;}
    if(el.dataset.selectBook){if(detail())return;const id=el.dataset.selectBook;state.selected=el.checked?[...new Set([...state.selected,id])]:state.selected.filter(v=>v!==id);renderChrome();persist();return;}
    if(el.dataset.selectChapter){if(!detail())return;const n=Number(el.dataset.selectChapter);state.chapterSelected=el.checked?[...new Set([...state.chapterSelected,n])]:state.chapterSelected.filter(v=>v!==n);renderChrome();persist();return;}
    if(el.dataset.selectRange){const b=detail();if(!b)return;state.chapterSelected=el.value==='current'?[b.current]:el.value==='forward'?ids(b.total-b.current+1,b.current):el.value==='all'?chapterIds(b):state.chapterSelected;render();persist();return;}
    if(el.dataset.setting){state[el.dataset.setting]=el.value;persist();}
  });
  root.addEventListener('input',event=>{if(event.target!==ui.search||detail())return;state.query=ui.search.value;state.selected=[];ui.scroll.scrollTop=0;renderList();renderChrome();if(window.lucide)window.lucide.createIcons({attrs:{width:18,height:18}});persist();});
  root.addEventListener('keydown',event=>{
    if(event.key==='Escape'){if(state.dialog)state.dialog=null;else if(state.sheet){closeSheet();return;}else if(state.manage){state.manage=false;state.selected=[];state.chapterSelected=[];}else if(detail()){returnToList();return;}render();persist();}
    if(event.key==='Tab'){
      const boundary=state.dialog?ui['dialog-layer']:state.sheet?ui.sheet:null;if(!boundary)return;
      const controls=[...boundary.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled])')].filter(el=>!el.closest('[hidden]'));
      const first=controls[0],last=controls[controls.length-1];
      if(!boundary.contains(document.activeElement)){event.preventDefault();first?.focus();}else if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}
    }
  });
  restore(window.openai?.widgetState);render();
  window.addEventListener('openai:set_globals',event=>{const incoming=event.detail?.globals?.widgetState;if(incoming?.privateContent?.demo==='shared-reader-download'&&incoming.privateContent.version===5&&!published.has(JSON.stringify(incoming.privateContent.snapshot))){restore(incoming);render();}});
})();
</script>
