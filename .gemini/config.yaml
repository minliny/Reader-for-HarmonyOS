have_fun: false

code_review:
  disable: false
  comment_severity_threshold: MEDIUM
  pull_request_opened:
    help: false
    summary: true
    code_review: true
    include_drafts: false

ignore_patterns:
  - "entry/vendor/**"
  - "entry/libs/**"
  - "oh_modules/**"
  - ".reader-artifacts/**"
  - "tests/contracts/rpc-projections.json"
  - "**/*.svg"
  - "**/*.png"
