name: Reader UI consumer lock

on:
  repository_dispatch:
    types: [reader-ui-updated]
  workflow_dispatch:
    inputs:
      reader_ui_ref:
        description: Optional Reader UI SHA/tag/ref; defaults to the locked source SHA
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: reader-ui-consumer-${{ github.event_name }}-${{ github.event.client_payload.releaseId || github.run_id }}
  cancel-in-progress: false

jobs:
  release-bump:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      pull-requests: write

    steps:
      - name: Check out HarmonyOS host
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: Reader-for-HarmonyOS
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      # Host-owned trust anchor: reject arbitrary repositories and malformed evidence
      # before any source-delivered Reader UI code is checked out or executed.
      - name: Host-owned bootstrap preflight for dispatch payload
        env:
          READER_UI_DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const payload = JSON.parse(process.env.READER_UI_DISPATCH_PAYLOAD);
          const exactKeys = (value, expected, label) => {
            if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error(`${label} must be an object`);
            const actual = Object.keys(value).sort();
            expected = [...expected].sort();
            if (actual.length !== expected.length || actual.some((key, index) => key !== expected[index])) {
              throw new Error(`${label} keys are not canonical`);
            }
          };
          const sha256 = (value, label) => {
            if (typeof value !== 'string' || !/^[0-9a-f]{64}$/.test(value)) throw new Error(`${label} must be SHA-256`);
          };
          exactKeys(payload, ['artifact', 'manifestSha256', 'releaseId', 'runtimeActionsSha256', 'runtimePayloadContractsSchemaVersion', 'runtimePayloadContractsSha256', 'source', 'tag', 'targetConfigSha256', 'version'], 'client_payload');
          if (!/^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.test(payload.version)) throw new Error('version is not canonical semver');
          if ((payload.version.split('-', 2)[1] || '').split('.').some((part) => /^0\d+$/.test(part))) throw new Error('numeric prerelease identifiers cannot contain leading zeroes');
          if (payload.tag !== `v${payload.version}`) throw new Error('tag does not match version');
          sha256(payload.runtimeActionsSha256, 'runtimeActionsSha256');
          if (!Number.isSafeInteger(payload.runtimePayloadContractsSchemaVersion) || payload.runtimePayloadContractsSchemaVersion < 1) throw new Error('runtimePayloadContractsSchemaVersion must be a positive safe integer');
          sha256(payload.runtimePayloadContractsSha256, 'runtimePayloadContractsSha256');
          sha256(payload.manifestSha256, 'manifestSha256');
          sha256(payload.targetConfigSha256, 'targetConfigSha256');
          exactKeys(payload.source, ['ref', 'repository', 'sha'], 'source');
          if (payload.source.repository !== 'minliny/Reader-UI') throw new Error('source.repository is not the canonical Reader UI authority');
          if (!/^(?:[0-9a-f]{40}|[0-9a-f]{64})$/.test(payload.source.sha)) throw new Error('source.sha is not canonical');
          if (payload.source.ref !== `refs/tags/${payload.tag}`) throw new Error('source.ref does not match tag');
          if (payload.releaseId !== `${payload.source.sha}:${payload.manifestSha256}`) throw new Error('releaseId is not bound to source SHA and manifest');
          exactKeys(payload.artifact, ['digest', 'id', 'inventoryPath', 'inventorySha256', 'manifestPath', 'name', 'sourcePrefix', 'workflowRunId'], 'artifact');
          if (typeof payload.artifact.id !== 'string' || typeof payload.artifact.workflowRunId !== 'string' || !/^[1-9]\d*$/.test(payload.artifact.id) || !/^[1-9]\d*$/.test(payload.artifact.workflowRunId)) throw new Error('artifact id/run id must be positive decimal strings');
          if (payload.artifact.name !== `reader-ui-${payload.tag}`) throw new Error('artifact name does not match tag');
          sha256(payload.artifact.digest, 'artifact.digest');
          sha256(payload.artifact.inventorySha256, 'artifact.inventorySha256');
          if (payload.artifact.manifestPath !== 'UI_RELEASE_MANIFEST.json' || payload.artifact.inventoryPath !== 'UI_RELEASE_ARTIFACT_INVENTORY.json' || payload.artifact.sourcePrefix !== 'source') {
            throw new Error('artifact paths are not canonical');
          }
          NODE
          {
            echo '### Reader UI bootstrap trust boundary'
            echo 'Host-owned preflight validates the canonical repository and immutable evidence before executing the source-delivered full verifier.'
            echo 'The full artifact/tree verifier is still shipped by Reader UI; vendoring that verifier is a later hardening boundary.'
            echo 'HarmonyOS proof remains static-only here; DevEco/HAP compile and physical-device proof are still blocked on a dedicated runner/device.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require cross-repository Reader UI token
        env:
          READER_UI_REPO_TOKEN: ${{ secrets.READER_UI_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$READER_UI_REPO_TOKEN" || { echo 'READER_UI_REPO_TOKEN is required' >&2; exit 1; }

      - name: Check out exact Reader UI release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: minliny/Reader-UI
          ref: ${{ github.event.client_payload.source.sha }}
          token: ${{ secrets.READER_UI_REPO_TOKEN }}
          path: Reader-UI
          persist-credentials: false

      - name: Download dispatch-bound Reader UI artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # v4 selects this single cross-repository artifact by immutable ID.
          # The source-delivered verifier then binds its name, run, digest, and source SHA through the API.
          artifact-ids: ${{ github.event.client_payload.artifact.id }}
          repository: minliny/Reader-UI
          run-id: ${{ github.event.client_payload.artifact.workflowRunId }}
          github-token: ${{ secrets.READER_UI_REPO_TOKEN }}
          merge-multiple: true
          path: Reader-UI-release

      - name: Verify immutable source, artifact, and dispatch evidence
        id: verify-release
        env:
          READER_UI_DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          READER_UI_REPO_TOKEN: ${{ secrets.READER_UI_REPO_TOKEN }}
        run: |
          set -euo pipefail
          node Reader-UI/tools/release/verify-host-release.mjs \
            --host harmonyos \
            --host-repository "$GITHUB_REPOSITORY" \
            --source-root Reader-UI \
            --artifact-root Reader-UI-release \
            --payload-env READER_UI_DISPATCH_PAYLOAD \
            --github-token-env READER_UI_REPO_TOKEN \
            --output "$RUNNER_TEMP/reader-ui-verified.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Update the verified HarmonyOS Reader UI lock pair
        id: update-lock
        run: |
          set -euo pipefail
          node Reader-UI/tools/release/update-host-consumer-lock.mjs \
            --lock Reader-for-HarmonyOS/READER_UI_CONSUMER.json \
            --verified-release "$RUNNER_TEMP/reader-ui-verified.json" \
            --github-output "$GITHUB_OUTPUT"
          node Reader-for-HarmonyOS/scripts/update_reader_ui_package_lock.mjs \
            --consumer-lock Reader-for-HarmonyOS/READER_UI_CONSUMER.json \
            --package-lock Reader-for-HarmonyOS/entry/oh-package-lock.json5 \
            --verified-release "$RUNNER_TEMP/reader-ui-verified.json"

      - name: Host-owned postcondition protects rollout and repository scope
        env:
          READER_UI_DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import {
            assertReaderUiReleaseBumpPaths,
            assertReaderUiPackageLockVersionUpdate,
            assertReaderUiReleaseLocksSynchronized,
            READER_UI_PACKAGE_LOCK_PATH,
            READER_UI_RELEASE_BUMP_PATHS,
          } from './Reader-for-HarmonyOS/scripts/reader_ui_release_lock_lib.mjs';
          const repository = 'Reader-for-HarmonyOS';
          const payload = JSON.parse(process.env.READER_UI_DISPATCH_PAYLOAD);
          const before = JSON.parse(execFileSync('git', ['-C', repository, 'show', 'HEAD:READER_UI_CONSUMER.json'], { encoding: 'utf8' }));
          const after = JSON.parse(fs.readFileSync(`${repository}/READER_UI_CONSUMER.json`, 'utf8'));
          const packageBefore = JSON.parse(execFileSync(
            'git', ['-C', repository, 'show', `HEAD:${READER_UI_PACKAGE_LOCK_PATH}`], { encoding: 'utf8' },
          ));
          const packageAfter = JSON.parse(fs.readFileSync(`${repository}/${READER_UI_PACKAGE_LOCK_PATH}`, 'utf8'));
          const exactKeys = (value, expected, label) => {
            const actual = Object.keys(value).sort(); expected = [...expected].sort();
            if (actual.length !== expected.length || actual.some((key, index) => key !== expected[index])) throw new Error(`${label} keys changed outside the lock v3 contract`);
          };
          exactKeys(after, ['blockedProof', 'host', 'hostRequestSchemaVersion', 'knownDifferences', 'readerUiVersion', 'releaseIdentity', 'rollout', 'runtimeActionsSchemaVersion', 'runtimeActionsSha256', 'runtimePayloadContractsSchemaVersion', 'runtimePayloadContractsSha256', 'schemaVersion'], 'consumer lock');
          exactKeys(after.releaseIdentity, ['manifestSha256', 'releaseId', 'sourceSha', 'targetConfigSha256'], 'releaseIdentity');
          for (const field of ['host', 'rollout', 'knownDifferences', 'blockedProof']) {
            if (JSON.stringify(before[field]) !== JSON.stringify(after[field])) throw new Error(`protected lock field changed: ${field}`);
          }
          if (after.schemaVersion !== 3 || after.readerUiVersion !== payload.version || after.runtimeActionsSha256 !== payload.runtimeActionsSha256 || after.runtimePayloadContractsSchemaVersion !== payload.runtimePayloadContractsSchemaVersion || after.runtimePayloadContractsSha256 !== payload.runtimePayloadContractsSha256) throw new Error('lock version/runtime identity does not match dispatch');
          if (after.releaseIdentity.releaseId !== payload.releaseId || after.releaseIdentity.sourceSha !== payload.source.sha || after.releaseIdentity.manifestSha256 !== payload.manifestSha256 || after.releaseIdentity.targetConfigSha256 !== payload.targetConfigSha256) throw new Error('lock releaseIdentity does not match dispatch');
          const version = JSON.parse(fs.readFileSync('Reader-UI-release/source/contracts/VERSION.json', 'utf8'));
          const runtimeBytes = fs.readFileSync('Reader-UI-release/source/ui-spec/runtime-actions.json');
          const runtime = JSON.parse(runtimeBytes);
          const payloadContractsBytes = fs.readFileSync('Reader-UI-release/source/ui-spec/runtime-payload-contracts.json');
          const payloadContracts = JSON.parse(payloadContractsBytes);
          if (version.version !== payload.version) throw new Error('artifact VERSION.json does not match dispatch version');
          if (version.schema?.['host-request'] !== after.hostRequestSchemaVersion || runtime.schemaVersion !== after.runtimeActionsSchemaVersion || payloadContracts.schemaVersion !== after.runtimePayloadContractsSchemaVersion) throw new Error('lock schema versions do not match the release artifact');
          if (crypto.createHash('sha256').update(runtimeBytes).digest('hex') !== payload.runtimeActionsSha256) throw new Error('artifact runtime actions do not match dispatch hash');
          if (crypto.createHash('sha256').update(payloadContractsBytes).digest('hex') !== payload.runtimePayloadContractsSha256) throw new Error('artifact runtime payload contracts do not match dispatch hash');
          assertReaderUiPackageLockVersionUpdate(packageBefore, packageAfter, payload.version);
          assertReaderUiReleaseLocksSynchronized(after, packageAfter);
          const status = execFileSync('git', ['-C', repository, 'status', '--porcelain=v1', '--untracked-files=all'], { encoding: 'utf8' }).trimEnd();
          const paths = status ? status.split(/\r?\n/).map((line) => line.slice(3)) : [];
          assertReaderUiReleaseBumpPaths(paths, 'host changes', { allowEmpty: true });
          execFileSync('git', ['-C', repository, 'diff', '--check', '--', ...READER_UI_RELEASE_BUMP_PATHS]);
          NODE

      - name: Verify version, action hash, release identity, rollout lock, and dependency wiring
        run: node Reader-UI/tools/runtime/check-host-consumers.mjs --host harmonyos

      - name: Verify HarmonyOS dual-lock consistency and exact bump scope
        working-directory: Reader-for-HarmonyOS
        run: |
          node scripts/check_reader_ui_shadow_allowlist.mjs
          npm run test:reader-ui-release-lock

      - name: Explain executable proof boundary
        run: |
          echo 'Static consumer gate passed.'
          echo 'Entry-only ArkTS/Hypium proof requires DevEco or a dedicated HarmonyOS runner:'
          echo 'cd Reader-for-HarmonyOS && npm test'
          echo 'Real Core NAPI proof additionally requires an attached hdc target:'
          echo 'cd Reader-for-HarmonyOS && npm run test:device'

      - name: Create or reuse deterministic draft bump PR
        env:
          HOST_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node Reader-for-HarmonyOS/scripts/publish-host-bump-pr.mjs \
            --host-root Reader-for-HarmonyOS \
            --consumer-lock Reader-for-HarmonyOS/READER_UI_CONSUMER.json \
            --package-lock Reader-for-HarmonyOS/entry/oh-package-lock.json5 \
            --verified-release "$RUNNER_TEMP/reader-ui-verified.json" \
            --host-repository "$GITHUB_REPOSITORY" \
            --base '${{ github.event.repository.default_branch }}' \
            --github-token-env HOST_GITHUB_TOKEN

  manual-verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out HarmonyOS host
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: Reader-for-HarmonyOS
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Resolve the read-only Reader UI ref
        id: ui-ref
        env:
          REQUESTED_REF: ${{ inputs.reader_ui_ref }}
        run: |
          set -euo pipefail
          locked_sha="$(node -p "JSON.parse(require('fs').readFileSync('Reader-for-HarmonyOS/READER_UI_CONSUMER.json', 'utf8')).releaseIdentity.sourceSha")"
          printf 'ref=%s\n' "${REQUESTED_REF:-$locked_sha}" >> "$GITHUB_OUTPUT"

      - name: Require cross-repository Reader UI token
        env:
          READER_UI_REPO_TOKEN: ${{ secrets.READER_UI_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$READER_UI_REPO_TOKEN" || { echo 'READER_UI_REPO_TOKEN is required' >&2; exit 1; }

      - name: Check out Reader UI for read-only validation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.repository_owner }}/Reader-UI
          ref: ${{ steps.ui-ref.outputs.ref }}
          token: ${{ secrets.READER_UI_REPO_TOKEN }}
          path: Reader-UI
          persist-credentials: false

      - name: Verify locked Reader UI release identity
        run: node Reader-UI/tools/runtime/check-host-consumers.mjs --host harmonyos

      - name: Explain executable proof boundary
        run: |
          echo 'Static consumer gate passed.'
          echo 'Entry-only ArkTS/Hypium proof requires DevEco or a dedicated HarmonyOS runner:'
          echo 'cd Reader-for-HarmonyOS && npm test'
          echo 'Real Core NAPI proof additionally requires an attached hdc target:'
          echo 'cd Reader-for-HarmonyOS && npm run test:device'
