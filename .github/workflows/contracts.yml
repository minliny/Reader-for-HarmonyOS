name: Host Explicit Checks
on:
  workflow_dispatch:
    inputs:
      host_domain:
        description: Host test domain to run
        type: choice
        default: none
        options: [none, all, bookshelf, contracts, delivery, detail-reading, downloads, manga, navigation-geometry, search, settings-sync-rss, source-management, source-switch]
      source_hygiene:
        description: Explicitly run actionlint and current tracked-source gitleaks
        required: false
        default: false
        type: boolean
      rationale:
        description: Changed behavior and reason for the selected checks
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: host-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Admit only the explicit selection
        id: selection
        env:
          HOST_DOMAIN: ${{ inputs.host_domain }}
          SOURCE_HYGIENE: ${{ inputs.source_hygiene }}
          RATIONALE: ${{ inputs.rationale }}
        run: |
          test -n "${RATIONALE//[[:space:]]/}" || { echo 'An item-specific necessity rationale is required.'; exit 2; }
          if test "$HOST_DOMAIN" = none && test "$SOURCE_HYGIENE" != true; then
            echo 'NOT_RUN: no check selected.'
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: inputs.host_domain != 'none'
        with:
          node-version: 22.23.3
      - name: Run the selected Host domain
        if: inputs.host_domain != 'none'
        env:
          HOST_DOMAIN: ${{ inputs.host_domain }}
        run: |
          if test "$HOST_DOMAIN" = all; then
            node scripts/test-host.mjs --all
          else
            node scripts/test-host.mjs --domain "$HOST_DOMAIN"
          fi
      - uses: ./.github/actions/source-hygiene
        if: always() && steps.selection.outcome == 'success' && inputs.source_hygiene
        with:
          directory: .
      - name: Evidence boundary
        if: always()
        run: echo 'This workflow records the selected Host tests and source hygiene. SDK, Native, HAP, signing and device acceptance have separate evidence.' >> "$GITHUB_STEP_SUMMARY"
  host-source-gate:
    name: contract-gate
    if: always()
    needs: source-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.source-check.result }}
        run: test "$RESULT" = success
