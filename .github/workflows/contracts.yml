name: Host Source CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: host-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: All declared repository-only regressions
        run: node tools/run-contract-tests.mjs --source
      - uses: ./.github/actions/source-hygiene
        if: always()
        with:
          directory: .
      - name: Evidence boundary
        run: echo 'Repository-only tests. Full SDK, cross-repository compatibility, Native, HAP and signing are verified on FnOS for the exact candidate SHAs.' >> "$GITHUB_STEP_SUMMARY"
  host-source-gate:
    name: host-source-gate
    if: always()
    needs: source-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.source-check.result }}
        run: test "$RESULT" = success
