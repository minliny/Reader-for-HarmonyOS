# Generated from Reader-Core/governance/source-hygiene/action.yml; run tools/source-hygiene/sync_source_hygiene.py --write.
name: Reader source hygiene
description: Check current tracked source, not private archives or complete Git history.
inputs:
  directory:
    required: true
    description: Checkout path
runs:
  using: composite
  steps:
    - name: Workflow and current tracked-source checks
      shell: bash
      env:
        CHECKOUT: ${{ inputs.directory }}
      run: |
        set -euo pipefail
        temp=$(mktemp -d "$RUNNER_TEMP/reader-hygiene.XXXXXX")
        trap 'rm -rf "$temp"' EXIT
        mkdir "$temp/tools" "$temp/source"
        (
          cd "$temp/tools"
          actionlint=actionlint_1.7.7_linux_amd64.tar.gz
          gitleaks=gitleaks_8.24.2_linux_x64.tar.gz
          curl --fail --silent --show-error --location --retry 3 -o "$actionlint" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.7/$actionlint"
          curl --fail --silent --show-error --location --retry 3 -o "$gitleaks" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/$gitleaks"
          # Digests from each version's official release checksums file.
          printf '%s  %s\n' \
            023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757 "$actionlint" \
            fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e "$gitleaks" \
            | sha256sum --check --strict -
          tar -xzf "$actionlint" actionlint
          tar -xzf "$gitleaks" gitleaks
        )
        cd "$CHECKOUT"
        "$temp/tools/actionlint" -color
        git archive HEAD | tar -xf - -C "$temp/source"
        cd "$temp/source"
        "$temp/tools/gitleaks" dir . --redact=100 -v
