name: Reader source hygiene
description: Check current tracked source, not private archives or complete Git history.
inputs:
  directory:
    required: true
    description: Checkout path
runs:
  using: composite
  steps:
    - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
      with:
        go-version: '1.24.2'
        cache: false
    - name: Install pinned upstream analyzers
      shell: bash
      run: |
        go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
        go install github.com/zricethezav/gitleaks/v8@v8.24.2
    - name: Workflow and current tracked-source checks
      shell: bash
      env:
        CHECKOUT: ${{ inputs.directory }}
      run: |
        cd "$CHECKOUT"
        "$(go env GOPATH)/bin/actionlint" -color
        scan=$(mktemp -d "$RUNNER_TEMP/reader-source.XXXXXX")
        trap 'rm -rf "$scan"' EXIT
        git archive HEAD | tar -xf - -C "$scan"
        cd "$scan"
        "$(go env GOPATH)/bin/gitleaks" dir . --redact=100
