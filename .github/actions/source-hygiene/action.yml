name: Reader source hygiene
description: Upstream secret detection and workflow validation, with no credentials.
inputs:
  directory:
    required: true
    description: Checkout path
  base:
    required: false
    description: Trusted event base SHA; empty means scan all reachable history
runs:
  using: composite
  steps:
    - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
      with:
        go-version: '1.24.2'
        cache: false
    - name: Install pinned upstream analyzers
      shell: bash
      run: |
        go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
        go install github.com/zricethezav/gitleaks/v8@v8.24.2
    - name: Workflow and secret checks
      shell: bash
      env:
        CHECKOUT: ${{ inputs.directory }}
        BASE_SHA: ${{ inputs.base }}
      run: |
        cd "$CHECKOUT"
        "$(go env GOPATH)/bin/actionlint" -color
        if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$BASE_SHA^{commit}"
          "$(go env GOPATH)/bin/gitleaks" git --redact=100 --log-opts="$BASE_SHA..HEAD" .
        else
          "$(go env GOPATH)/bin/gitleaks" git --redact=100 .
        fi
