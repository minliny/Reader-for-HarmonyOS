  componentSets:
    941:6:
      id: 941:6
      key: 37641613e882c8bff9489a29a5cd6128f6a4b397
      name: Page/Bookshelf
      description: 'Live-demo-derived responsive page master. Viewport variants: Phone, Tablet. ReadingProgress=Available renders ContinueReading; ReadingProgress=None removes it and preserves the same Container auto-layout so the shelf section moves to the top. Compact is not provided.'
    461:468:
      id: 461:468
      key: b31b8ec04839128b1f266f7565bdd23f26b21881
      name: Navigation/AppTopBar
      description: 'Reusable Reader AppTopBar. Live demo contract: 390×58, padding 6px 20px 0, 29px serif title, 44px actions, 18px action gap. Transparent; inherits Shell surface.'
    1986:682:
      id: 1986:682
      key: 74a0d1512c375dabf6a3739f98ca04c8b2ceb098
      name: Navigation/IconButton
      description: 'Canonical icon button with 44px target. States: Default, Hover, Pressed, Focus, Disabled, Selected, Loading. Icon remains instance-swappable. Motion: button.press 80ms / activate 120ms; Reduced resolves to 0ms.'
    493:185:
      id: 493:185
      key: 53c92ca2cf1038da2935375245302b230184b8e7
      name: Library/BookCover
      description: Six local demo cover assets as image-fill variants.
    1994:464:
      id: 1994:464
      key: 86b23812d9a677d68ea85c7fdea02a1d3d73b924
      name: Library/ContinueAction
      description: Canonical binding foundation/text-button. ActionId library.continue. States Default/Hover/Pressed/Focus/Disabled/Loading. Minimum target 44px. Motion button press/activate; Reduced 0ms.
    487:228:
      id: 487:228
      key: 3b4cf4d04eafc804c85ff5786effea5c829b19b6
      name: Library/SectionHeader
      description: Bookshelf section header rebuilt from the live demo. View and filter states are explicit variants.
    487:75:
      id: 487:75
      key: f534d0950a9a41999d6525b1a3a2bd67918a6360
      name: Library/SectionAction
      description: 'Exact bookshelf header actions from the live 390×844 demo: 34px target, 20px Tabler icon.'
    493:196:
      id: 493:196
      key: a9ee47ad4c508157892e80ce76cc9ac0a6e98633
      name: Library/BookCard
      description: Canonical reusable bookshelf card. Cover and List layouts support Phone and Tablet without geometric stretching; Tablet List uses a 64×96 cover and a 44×44 action target.
    344:379:
      id: 344:379
      key: 66e0171649c24494a77c42ef7f6051eb4619357f
      name: Navigation/BottomNav
      description: Bottom navigation semantic variants. Direct tab hit targets carry ActionIds; actual screen navigation is applied at shell instances because Figma does not allow child layers to CHANGE_TO a parent component variant.
    342:175:
      id: 342:175
      key: dd7832257946e92807de07b2a3557f4621ceb119
      name: Navigation/MainTabItem
      description: Navigation tab item. Semantic State remains Unselected/Selected; Interaction adds Default/Hover/Pressed/Focus/Disabled. ActionId nav.tab.select. Motion tab.press 80ms, tab.select 120ms.
