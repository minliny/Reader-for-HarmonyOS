      key: 23b9168a34ed42d6a6874c724f6157a22d2d387b
      name: Reader/Responsive/ReadingSurface
      description: 响应式阅读正文画布。三个 Viewport 共享 Reader/Content/ChapterPage；正文来自同一完整章节经本地分页器生成的 manifest。控制层只能悬浮覆盖，不得改变 ReadingContent 的宽高或正文输入。
    1023:18380:
      id: 1023:18380
      key: d6e7713b55a328aba7bfa192765638270126ba78
      name: Reader/Responsive/TopBar
