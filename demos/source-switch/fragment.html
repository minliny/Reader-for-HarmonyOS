<div id="reader-source-discovery">
  <div class="viz-row" style="justify-content:space-between;margin-bottom:12px">
    <span class="text-small">动态示意 · 模拟来源与延迟</span>
    <button type="button" class="btn" data-replay>从零演示</button>
  </div>
  <div class="viz-dotted-background rd-preview">
    <section class="rd-phone" data-phone data-searching="true" data-foreground="true" aria-label="Reader 换源页动态设计提案">
      <div class="rd-system" aria-hidden="true"><span>08:05</span><span>5G · 100%</span></div>
      <header class="rd-header">
        <button type="button" class="rd-icon cursor-interaction" aria-label="返回并结束演示" data-back><i data-lucide="chevron-left" aria-hidden="true"></i></button>
        <h2>更换书源</h2>
        <button type="button" class="rd-action cursor-interaction" data-scan>停止</button>
      </header>
      <div class="rd-book">
        <div class="rd-cover" aria-hidden="true">晚唐<br>浮生</div>
        <div><div class="rd-title">晚唐浮生</div><div class="rd-muted">当前来源 · 竹简书库</div><div class="rd-muted">第一百二十六章 · 东风</div></div>
      </div>
      <div class="rd-state"><span class="rd-search-state"><span class="rd-search-spinner" aria-hidden="true"><i data-lucide="loader-circle" aria-hidden="true"></i></span><span data-status role="status" aria-live="polite">正在查找 · 已发现 0 个</span></span><span class="rd-muted">延迟优先</span></div>
      <div class="rd-empty" data-empty>可用来源将陆续出现在这里</div>
      <div class="rd-list" data-list role="group" aria-label="可用书源，按延迟排序"></div>
      <div class="rd-feedback" data-feedback role="status" aria-live="polite"></div>
      <div class="rd-home" aria-hidden="true"></div>
    </section>
  </div>
</div>
<style>
  #reader-source-discovery .rd-preview {padding:16px 0;display:flex;justify-content:center}
  #reader-source-discovery .rd-phone {--rd-paper:#f8f4ec;--rd-ink:#1f1b17;--rd-green:#2d4a3e;--rd-secondary:#756e63;--rd-line:#e3ded5;--rd-selected:#e8ece5;box-sizing:border-box;width:100%;max-width:365.714px;aspect-ratio:1280/2832;background:var(--rd-paper);color:var(--rd-ink);font-family:-apple-system,BlinkMacSystemFont,"HarmonyOS Sans SC","Noto Sans CJK SC",sans-serif;font-size:15px;line-height:1.45;display:flex;flex-direction:column;position:relative;border:1px solid var(--rd-line);border-radius:16px;overflow:hidden}
  #reader-source-discovery .rd-phone * {box-sizing:border-box}
  #reader-source-discovery .rd-system {height:39px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
  #reader-source-discovery .rd-header {height:53px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 9px;border-bottom:1px solid var(--rd-line);gap:6px}
  #reader-source-discovery .rd-header h2 {font-family:"Songti SC","Noto Serif CJK SC",serif;font-weight:600;font-size:20px;line-height:1.4;margin:0;flex:1}
  #reader-source-discovery .rd-icon,#reader-source-discovery .rd-action {border:0;background:none;color:var(--rd-green);font:inherit;height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;padding:0 8px;border-radius:8px}
  #reader-source-discovery .rd-action {font-size:13px}
  #reader-source-discovery .rd-icon {color:var(--rd-ink)}
  #reader-source-discovery .rd-book {padding:18px 18px 16px;display:flex;align-items:center;gap:13px;flex:none}
  #reader-source-discovery .rd-cover {width:43px;height:61px;flex:none;background:#ede7dc;border:1px solid var(--rd-line);border-radius:5px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:"Songti SC","Noto Serif CJK SC",serif;font-size:13px;line-height:1.6}
  #reader-source-discovery .rd-title {font-family:"Songti SC","Noto Serif CJK SC",serif;font-weight:600;font-size:20px;line-height:1.35;margin-bottom:4px}
  #reader-source-discovery .rd-muted {font-size:12px;color:var(--rd-secondary);line-height:1.6}
  #reader-source-discovery .rd-state {height:43px;flex:none;margin:0 18px;border-top:1px solid var(--rd-line);border-bottom:1px solid var(--rd-line);display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:12px;color:var(--rd-green)}
  #reader-source-discovery .rd-search-state {display:inline-flex;align-items:center;gap:6px;min-width:0;font-variant-numeric:tabular-nums}
  #reader-source-discovery .rd-search-spinner {display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;flex:none;color:var(--rd-green);visibility:hidden;animation:rd-search-orbit 1.1s linear infinite;animation-play-state:paused}
  #reader-source-discovery .rd-search-spinner svg {width:13px;height:13px}
  #reader-source-discovery [data-searching="true"] .rd-search-spinner {visibility:visible;animation-play-state:running}
  #reader-source-discovery [data-foreground="false"] .rd-search-spinner {animation-play-state:paused}
  @keyframes rd-search-orbit {to {transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce) {#reader-source-discovery .rd-search-spinner {animation:none!important}}
  #reader-source-discovery .rd-empty {padding:31px 18px;text-align:center;color:var(--rd-secondary);font-size:13px}
  #reader-source-discovery .rd-empty[hidden] {display:none}
  #reader-source-discovery .rd-list {margin:0 18px}
  #reader-source-discovery .rd-source {font:inherit;width:100%;border:0;border-bottom:1px solid var(--rd-line);border-radius:0;padding:12px 0;background:var(--rd-paper);color:var(--rd-ink);text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:65px;position:relative}
  #reader-source-discovery .rd-source:disabled {opacity:1}
  #reader-source-discovery .rd-source[aria-pressed="true"] {background:var(--rd-selected)}
  #reader-source-discovery .rd-name {font-size:15px;line-height:1.4;display:block}
  #reader-source-discovery .rd-meta {display:block;font-size:12px;line-height:1.5;color:var(--rd-secondary);margin-top:3px}
  #reader-source-discovery .rd-delay {width:65px;flex:none;text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:var(--rd-green);white-space:nowrap}
  #reader-source-discovery .rd-delay small {display:block;font:inherit;font-size:11px;color:var(--rd-secondary)}
  #reader-source-discovery .rd-feedback {font-size:12px;color:var(--rd-green);padding:14px 18px;min-height:44px}
  #reader-source-discovery .rd-home {height:4px;width:108px;margin:auto auto 8px;background:var(--rd-line);border-radius:4px;flex:none}
</style>
<script>
(() => {
  const root = document.getElementById('reader-source-discovery');
  const phone = root.querySelector('[data-phone]');
  const list = root.querySelector('[data-list]');
  const status = root.querySelector('[data-status]');
  const empty = root.querySelector('[data-empty]');
  const feedback = root.querySelector('[data-feedback]');
  const scanButton = root.querySelector('[data-scan]');
  const replay = root.querySelector('[data-replay]');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const samples = [
    {id:'pine', name:'松间书屋', latest:'最新 · 第一百三十二章', delay:940},
    {id:'cloud', name:'云海阅读', latest:'最新 · 第一百三十一章', delay:510},
    {id:'mountain', name:'远山书库', latest:'最新 · 第一百三十二章', delay:1240},
    {id:'leaf', name:'青叶书坊', latest:'最新 · 第一百三十二章', delay:330},
    {id:'moon', name:'月下藏书', latest:'最新 · 第一百三十章', delay:680},
    {id:'river', name:'溪流阅读', latest:'最新 · 第一百三十二章', delay:240}
  ];
  let rows = new Map();
  let timers = [];
  let generation = 0;
  let running = false;
  let selected = null;
  let holding = false;
  let focused = false;
  let scrolling = false;
  let settleTimer = 0;
  let pending = false;
  let round = 0;
  const persist = (chosen) => {
    if (window.openai && window.openai.setWidgetState) {
      window.openai.setWidgetState({modelContent:{demo:'source-discovery',selectedSource:chosen},privateContent:{selectedSource:chosen}}).catch(() => {});
    }
  };
  function stopTimers() { generation++;timers.forEach(clearTimeout);timers=[]; }
  function later(fn, delay) { const token=generation;timers.push(setTimeout(() => {if(token===generation) fn();},delay)); }
  function reorder() {
    if (selected || holding || focused || scrolling) {pending=true;return;}
    pending=false;
    const before = new Map([...rows.values()].map(row => [row.id,row.node.getBoundingClientRect().top]));
    const ordered = [...rows.values()].sort((a,b) => Number(b.fresh)-Number(a.fresh) || a.delay-b.delay || a.order-b.order);
    ordered.forEach(row => list.appendChild(row.node));
    ordered.forEach(row => {
      const previous = before.get(row.id);
      const distance = previous-row.node.getBoundingClientRect().top;
      if (!reduceMotion && Math.abs(distance)>1 && row.node.animate) {
        row.node.getAnimations().forEach(animation => animation.cancel());
        row.node.animate([{transform:`translateY(${distance}px)`},{transform:'translateY(0)'}],{duration:240,easing:'ease-out'});
      }
    });
  }
  function paint() {
    phone.dataset.searching=String(running);
    empty.hidden = rows.size>0;
    status.textContent = running ? `正在查找 · 已发现 ${[...rows.values()].filter(row=>row.fresh).length} 个` : `查找完成 · ${rows.size} 个来源`;
    rows.forEach(row => {
      row.time.textContent=`${row.delay} ms`;
      row.note.textContent=row.fresh?'':'重测中';
    });
    reorder();
  }
  function upsert(sample) {
    if(selected)return;
    let row=rows.get(sample.id);
    if(row) {row.delay=sample.delay;row.fresh=true;paint();return;}
    const node=document.createElement('button');
    node.type='button';node.className='rd-source cursor-interaction';node.dataset.source=sample.id;node.setAttribute('aria-pressed','false');
    const content=document.createElement('span');
    const name=document.createElement('span');name.className='rd-name';name.textContent=sample.name;
    const meta=document.createElement('span');meta.className='rd-meta';meta.textContent=sample.latest;
    content.append(name,meta);
    const delay=document.createElement('span');delay.className='rd-delay';
    const time=document.createElement('span');const note=document.createElement('small');delay.append(time,note);
    node.append(content,delay);list.appendChild(node);
    row={...sample,node,time,note,fresh:true,order:rows.size};rows.set(sample.id,row);
    node.addEventListener('click',() => choose(sample.id));
    paint();
  }
  function choose(id) {
    if(selected)return;
    selected=id;running=false;stopTimers();
    phone.dataset.searching='false';
    const chosen=rows.get(id);
    rows.forEach(row => {row.node.disabled=true;row.node.setAttribute('aria-pressed',String(row.id===id));});
    chosen.time.textContent='切换中';chosen.note.textContent='';
    status.textContent='正在打开所选来源';scanButton.disabled=true;
    later(() => {
      chosen.time.textContent='已选择';
      status.textContent='演示结束';
      feedback.textContent=`已选择「${chosen.name}」· 实际产品此时进入阅读`;
      persist(chosen.name);
    },800);
  }
  function start(clear) {
    stopTimers();running=true;selected=null;holding=false;focused=false;scrolling=false;pending=false;
    clearTimeout(settleTimer);round++;
    feedback.textContent='';scanButton.disabled=false;scanButton.textContent='停止';
    if(clear) {rows.clear();list.replaceChildren();}
    else rows.forEach(row=>{row.fresh=false;row.node.disabled=false;row.node.setAttribute('aria-pressed','false');});
    paint();
    samples.forEach((sample,index) => later(() => upsert({...sample,delay:sample.delay+(round%2===0?(index%2===0?80:-40):0)}),1300+index*1550));
    later(() => upsert({...samples[0],delay:410}),10100);
    later(() => {running=false;scanButton.textContent='重新查找';paint();},12000);
  }
  function stop(label) {
    stopTimers();running=false;scanButton.textContent='重新查找';status.textContent=label;
    phone.dataset.searching='false';
    if(!rows.size)empty.textContent='尚未发现可用来源';
  }
  function release() {holding=false;clearTimeout(settleTimer);settleTimer=setTimeout(()=>{if(pending)reorder();},300);}
  list.addEventListener('pointerdown',()=>{holding=true;});
  window.addEventListener('pointerup',release);
  window.addEventListener('pointercancel',release);
  document.addEventListener('visibilitychange',()=>{phone.dataset.foreground=String(!document.hidden);});
  phone.dataset.foreground=String(!document.hidden);
  list.addEventListener('focusin',()=>{focused=true;});
  list.addEventListener('focusout',()=>setTimeout(()=>{focused=list.contains(document.activeElement);if(!focused&&pending)reorder();},0));
  root.addEventListener('wheel',()=>{scrolling=true;clearTimeout(settleTimer);settleTimer=setTimeout(()=>{scrolling=false;if(pending)reorder();},350);},{passive:true});
  replay.addEventListener('click',()=>{empty.textContent='可用来源将陆续出现在这里';start(true);persist(null);});
  scanButton.addEventListener('click',()=>{if(running)stop(`已停止查找 · ${rows.size} 个来源`);else start(false);});
  root.querySelector('[data-back]').addEventListener('click',()=>{stop('已返回 · 演示结束');feedback.textContent='原来源与阅读位置保持不变';});
  function restore(state) {
    const prior=state && state.privateContent && state.privateContent.selectedSource;
    if(prior) feedback.textContent=`上次演示选择：${prior}`;
  }
  restore(window.openai && window.openai.widgetState);
  window.addEventListener('openai:set_globals',event=>{if(event.detail && event.detail.globals)restore(event.detail.globals.widgetState);});
  start(true);
})();
</script>
